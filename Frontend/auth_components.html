<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cộng đồng Gia Lai - Đăng nhập / Đăng ký</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .auth-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .auth-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }

        .form-focus:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .password-strength-weak { color: #ef4444; }
        .password-strength-medium { color: #f59e0b; }
        .password-strength-strong { color: #10b981; }

        .slide-in {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext } = React;

        // API Configuration
        const API_BASE_URL = 'http://localhost:8000';

        const api = axios.create({
            baseURL: API_BASE_URL,
            timeout: 30000,
        });

        // Auth Context
        const AuthContext = createContext();

        // Auth Provider Component
        const AuthProvider = ({ children }) => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [token, setToken] = useState(null);

            useEffect(() => {
                const initAuth = async () => {
                    const storedToken = localStorage.getItem('access_token');
                    if (storedToken) {
                        api.defaults.headers.Authorization = `Bearer ${storedToken}`;
                        try {
                            const response = await api.get('/auth/me');
                            setUser(response.data);
                            setToken(storedToken);
                        } catch (error) {
                            localStorage.removeItem('access_token');
                            localStorage.removeItem('refresh_token');
                            delete api.defaults.headers.Authorization;
                        }
                    }
                    setLoading(false);
                };

                initAuth();
            }, []);

            const login = async (credentials) => {
                try {
                    const response = await api.post('/auth/login', credentials);
                    const { access_token, refresh_token } = response.data;

                    localStorage.setItem('access_token', access_token);
                    localStorage.setItem('refresh_token', refresh_token);

                    api.defaults.headers.Authorization = `Bearer ${access_token}`;

                    const userResponse = await api.get('/auth/me');
                    setUser(userResponse.data);
                    setToken(access_token);

                    return { success: true };
                } catch (error) {
                    return {
                        success: false,
                        error: error.response?.data?.detail || 'Đăng nhập thất bại'
                    };
                }
            };

            const register = async (userData) => {
                try {
                    const response = await api.post('/auth/register', userData);
                    const { access_token, refresh_token } = response.data;

                    localStorage.setItem('access_token', access_token);
                    localStorage.setItem('refresh_token', refresh_token);

                    api.defaults.headers.Authorization = `Bearer ${access_token}`;

                    const userResponse = await api.get('/auth/me');
                    setUser(userResponse.data);
                    setToken(access_token);

                    return { success: true };
                } catch (error) {
                    return {
                        success: false,
                        error: error.response?.data?.detail || 'Đăng ký thất bại'
                    };
                }
            };

            const logout = () => {
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                delete api.defaults.headers.Authorization;
                setUser(null);
                setToken(null);
            };

            const value = {
                user,
                token,
                loading,
                login,
                register,
                logout,
                isAuthenticated: !!user
            };

            return (
                <AuthContext.Provider value={value}>
                    {children}
                </AuthContext.Provider>
            );
        };

        // Hook to use auth context
        const useAuth = () => {
            const context = useContext(AuthContext);
            if (!context) {
                throw new Error('useAuth must be used within AuthProvider');
            }
            return context;
        };

        // Password Strength Component
        const PasswordStrength = ({ password }) => {
            const getStrength = (pwd) => {
                if (!pwd) return { score: 0, label: '', color: '' };

                let score = 0;
                if (pwd.length >= 8) score++;
                if (/[a-z]/.test(pwd)) score++;
                if (/[A-Z]/.test(pwd)) score++;
                if (/[0-9]/.test(pwd)) score++;
                if (/[^A-Za-z0-9]/.test(pwd)) score++;

                if (score <= 2) return { score, label: 'Yếu', color: 'password-strength-weak' };
                if (score <= 4) return { score, label: 'Trung bình', color: 'password-strength-medium' };
                return { score, label: 'Mạnh', color: 'password-strength-strong' };
            };

            const strength = getStrength(password);

            return (
                <div className="mt-2">
                    <div className="flex items-center space-x-2">
                        <div className="flex-1 bg-gray-200 rounded-full h-2">
                            <div
                                className={`h-2 rounded-full transition-all duration-300 ${
                                    strength.score <= 2 ? 'bg-red-500' :
                                    strength.score <= 4 ? 'bg-yellow-500' : 'bg-green-500'
                                }`}
                                style={{ width: `${(strength.score / 5) * 100}%` }}
                            ></div>
                        </div>
                        <span className={`text-sm font-medium ${strength.color}`}>
                            {strength.label}
                        </span>
                    </div>
                </div>
            );
        };

        // Login Form Component
        const LoginForm = ({ onSwitchToRegister, onLoginSuccess }) => {
            const [formData, setFormData] = useState({
                username_or_email: '',
                password: ''
            });
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const { login } = useAuth();

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');

                const result = await login(formData);

                if (result.success) {
                    onLoginSuccess?.();
                } else {
                    setError(result.error);
                }

                setLoading(false);
            };

            const handleChange = (e) => {
                setFormData({
                    ...formData,
                    [e.target.name]: e.target.value
                });
            };

            return (
                <div className="slide-in">
                    <div className="text-center mb-8">
                        <h2 className="text-3xl font-bold text-gray-900">Đăng nhập</h2>
                        <p className="mt-2 text-gray-600">Chào mừng bạn quay lại!</p>
                    </div>

                    <form onSubmit={handleSubmit} className="space-y-6">
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                Tên đăng nhập hoặc Email
                            </label>
                            <input
                                type="text"
                                name="username_or_email"
                                value={formData.username_or_email}
                                onChange={handleChange}
                                required
                                className="w-full px-4 py-3 border border-gray-300 rounded-lg form-focus transition-all"
                                placeholder="Nhập username hoặc email"
                            />
                        </div>

                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                Mật khẩu
                            </label>
                            <input
                                type="password"
                                name="password"
                                value={formData.password}
                                onChange={handleChange}
                                required
                                className="w-full px-4 py-3 border border-gray-300 rounded-lg form-focus transition-all"
                                placeholder="Nhập mật khẩu"
                            />
                        </div>

                        {error && (
                            <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg">
                                <i className="fas fa-exclamation-triangle mr-2"></i>
                                {error}
                            </div>
                        )}

                        <button
                            type="submit"
                            disabled={loading || !formData.username_or_email || !formData.password}
                            className="w-full bg-blue-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                        >
                            {loading ? (
                                <>
                                    <i className="fas fa-spinner fa-spin mr-2"></i>
                                    Đang đăng nhập...
                                </>
                            ) : (
                                <>
                                    <i className="fas fa-sign-in-alt mr-2"></i>
                                    Đăng nhập
                                </>
                            )}
                        </button>
                    </form>

                    <div className="mt-6 text-center">
                        <p className="text-gray-600">
                            Chưa có tài khoản?{' '}
                            <button
                                onClick={onSwitchToRegister}
                                className="text-blue-600 hover:text-blue-700 font-semibold"
                            >
                                Đăng ký ngay
                            </button>
                        </p>
                    </div>
                </div>
            );
        };

        // Register Form Component
        const RegisterForm = ({ onSwitchToLogin, onRegisterSuccess }) => {
            const [formData, setFormData] = useState({
                username: '',
                email: '',
                full_name: '',
                phone: '',
                password: '',
                confirm_password: '',
                is_restaurant_owner: false
            });
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [fieldErrors, setFieldErrors] = useState({});
            const { register } = useAuth();

            const validateForm = () => {
                const errors = {};

                if (formData.username.length < 3) {
                    errors.username = 'Username phải có ít nhất 3 ký tự';
                }

                if (!/\S+@\S+\.\S+/.test(formData.email)) {
                    errors.email = 'Email không hợp lệ';
                }

                if (formData.password.length < 8) {
                    errors.password = 'Mật khẩu phải có ít nhất 8 ký tự';
                }

                if (formData.password !== formData.confirm_password) {
                    errors.confirm_password = 'Mật khẩu xác nhận không khớp';
                }

                setFieldErrors(errors);
                return Object.keys(errors).length === 0;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();

                if (!validateForm()) return;

                setLoading(true);
                setError('');

                const { confirm_password, ...registerData } = formData;
                const result = await register(registerData);

                if (result.success) {
                    onRegisterSuccess?.();
                } else {
                    setError(result.error);
                }

                setLoading(false);
            };

            const handleChange = (e) => {
                const { name, value, type, checked } = e.target;
                setFormData({
                    ...formData,
                    [name]: type === 'checkbox' ? checked : value
                });

                if (fieldErrors[name]) {
                    setFieldErrors({
                        ...fieldErrors,
                        [name]: ''
                    });
                }
            };

            return (
                <div className="slide-in">
                    <div className="text-center mb-8">
                        <h2 className="text-3xl font-bold text-gray-900">Đăng ký</h2>
                        <p className="mt-2 text-gray-600">Tạo tài khoản mới để bắt đầu</p>
                    </div>

                    <form onSubmit={handleSubmit} className="space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Tên đăng nhập *
                                </label>
                                <input
                                    type="text"
                                    name="username"
                                    value={formData.username}
                                    onChange={handleChange}
                                    required
                                    className={`w-full px-4 py-3 border rounded-lg form-focus transition-all ${
                                        fieldErrors.username ? 'border-red-500' : 'border-gray-300'
                                    }`}
                                    placeholder="username123"
                                />
                                {fieldErrors.username && (
                                    <p className="mt-1 text-sm text-red-600">{fieldErrors.username}</p>
                                )}
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Họ và tên *
                                </label>
                                <input
                                    type="text"
                                    name="full_name"
                                    value={formData.full_name}
                                    onChange={handleChange}
                                    required
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg form-focus transition-all"
                                    placeholder="Nguyễn Văn A"
                                />
                            </div>
                        </div>

                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                Email *
                            </label>
                            <input
                                type="email"
                                name="email"
                                value={formData.email}
                                onChange={handleChange}
                                required
                                className={`w-full px-4 py-3 border rounded-lg form-focus transition-all ${
                                    fieldErrors.email ? 'border-red-500' : 'border-gray-300'
                                }`}
                                placeholder="example@email.com"
                            />
                            {fieldErrors.email && (
                                <p className="mt-1 text-sm text-red-600">{fieldErrors.email}</p>
                            )}
                        </div>

                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                Số điện thoại
                            </label>
                            <input
                                type="tel"
                                name="phone"
                                value={formData.phone}
                                onChange={handleChange}
                                className="w-full px-4 py-3 border border-gray-300 rounded-lg form-focus transition-all"
                                placeholder="0901234567"
                            />
                        </div>

                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                Mật khẩu *
                            </label>
                            <input
                                type="password"
                                name="password"
                                value={formData.password}
                                onChange={handleChange}
                                required
                                className={`w-full px-4 py-3 border rounded-lg form-focus transition-all ${
                                    fieldErrors.password ? 'border-red-500' : 'border-gray-300'
                                }`}
                                placeholder="Ít nhất 8 ký tự"
                            />
                            <PasswordStrength password={formData.password} />
                            {fieldErrors.password && (
                                <p className="mt-1 text-sm text-red-600">{fieldErrors.password}</p>
                            )}
                        </div>

                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                Xác nhận mật khẩu *
                            </label>
                            <input
                                type="password"
                                name="confirm_password"
                                value={formData.confirm_password}
                                onChange={handleChange}
                                required
                                className={`w-full px-4 py-3 border rounded-lg form-focus transition-all ${
                                    fieldErrors.confirm_password ? 'border-red-500' : 'border-gray-300'
                                }`}
                                placeholder="Nhập lại mật khẩu"
                            />
                            {fieldErrors.confirm_password && (
                                <p className="mt-1 text-sm text-red-600">{fieldErrors.confirm_password}</p>
                            )}
                        </div>

                        <div className="flex items-center">
                            <input
                                type="checkbox"
                                name="is_restaurant_owner"
                                checked={formData.is_restaurant_owner}
                                onChange={handleChange}
                                className="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                            />
                            <label className="ml-2 block text-sm text-gray-700">
                                Tôi là chủ nhà hàng/quán ăn
                            </label>
                        </div>

                        {error && (
                            <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg">
                                <i className="fas fa-exclamation-triangle mr-2"></i>
                                {error}
                            </div>
                        )}

                        <button
                            type="submit"
                            disabled={loading || !formData.username || !formData.email || !formData.password}
                            className="w-full bg-green-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                        >
                            {loading ? (
                                <>
                                    <i className="fas fa-spinner fa-spin mr-2"></i>
                                    Đang đăng ký...
                                </>
                            ) : (
                                <>
                                    <i className="fas fa-user-plus mr-2"></i>
                                    Đăng ký
                                </>
                            )}
                        </button>
                    </form>

                    <div className="mt-6 text-center">
                        <p className="text-gray-600">
                            Đã có tài khoản?{' '}
                            <button
                                onClick={onSwitchToLogin}
                                className="text-blue-600 hover:text-blue-700 font-semibold"
                            >
                                Đăng nhập ngay
                            </button>
                        </p>
                    </div>
                </div>
            );
        };

        // Auth Modal Component
        const AuthModal = ({ isOpen, onClose, initialMode = 'login' }) => {
            const [mode, setMode] = useState(initialMode);

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                    <div className="auth-card rounded-xl p-8 max-w-md w-full max-h-[90vh] overflow-y-auto relative">
                        <button
                            onClick={onClose}
                            className="absolute top-4 right-4 text-gray-400 hover:text-gray-600 z-10"
                        >
                            <i className="fas fa-times text-xl"></i>
                        </button>

                        {mode === 'login' ? (
                            <LoginForm
                                onSwitchToRegister={() => setMode('register')}
                                onLoginSuccess={onClose}
                            />
                        ) : (
                            <RegisterForm
                                onSwitchToLogin={() => setMode('login')}
                                onRegisterSuccess={onClose}
                            />
                        )}
                    </div>
                </div>
            );
        };

        // User Profile Component
        const UserProfile = () => {
            const { user, logout } = useAuth();

            const handleLogout = () => {
                if (confirm('Bạn có chắc chắn muốn đăng xuất?')) {
                    logout();
                    // Redirect về trang chủ sau khi đăng xuất
                    window.location.href = 'index.html';
                }
            };

            return (
                <div className="bg-white rounded-lg shadow-lg p-6">
                    <div className="flex items-center space-x-4 mb-6">
                        <div className="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center">
                            <i className="fas fa-user text-2xl text-white"></i>
                        </div>
                        <div>
                            <h3 className="text-xl font-bold text-gray-900">{user.full_name}</h3>
                            <p className="text-gray-600">@{user.username}</p>
                            {user.is_restaurant_owner && (
                                <span className="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-orange-100 text-orange-800 mt-2">
                                    <i className="fas fa-store mr-1"></i>
                                    Chủ nhà hàng
                                </span>
                            )}
                        </div>
                    </div>

                    <div className="space-y-4">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700">Email</label>
                                <p className="mt-1 text-gray-900">{user.email}</p>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700">Số điện thoại</label>
                                <p className="mt-1 text-gray-900">{user.phone || 'Chưa cập nhật'}</p>
                            </div>
                        </div>

                        <div>
                            <label className="block text-sm font-medium text-gray-700">Ngày tham gia</label>
                            <p className="mt-1 text-gray-900">
                                {new Date(user.created_at).toLocaleDateString('vi-VN')}
                            </p>
                        </div>
                    </div>

                    <div className="mt-8 flex space-x-4">
                        <button className="flex-1 bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition-colors">
                            <i className="fas fa-edit mr-2"></i>
                            Chỉnh sửa hồ sơ
                        </button>
                        <a
                            href="index.html"
                            className="flex-1 bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700 transition-colors text-center"
                        >
                            <i className="fas fa-home mr-2"></i>
                            Về trang chủ
                        </a>
                        <button
                            onClick={handleLogout}
                            className="flex-1 bg-red-600 text-white py-2 px-4 rounded-lg hover:bg-red-700 transition-colors"
                        >
                            <i className="fas fa-sign-out-alt mr-2"></i>
                            Đăng xuất
                        </button>
                    </div>
                </div>
            );
        };

        // Main App with Authentication
        const AuthenticatedApp = () => {
            const { user, loading, isAuthenticated } = useAuth();
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [authMode, setAuthMode] = useState('login');

            const openAuthModal = (mode = 'login') => {
                setAuthMode(mode);
                setShowAuthModal(true);
            };

            if (loading) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                        <div className="text-center">
                            <i className="fas fa-spinner fa-spin text-4xl text-blue-600 mb-4"></i>
                            <p className="text-gray-600">Đang tải...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Header */}
                    <header className="auth-gradient shadow-lg">
                        <div className="container mx-auto px-6 py-4">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center space-x-4">
                                    <i className="fas fa-utensils text-white text-3xl"></i>
                                    <div>
                                        <h1 className="text-white text-2xl font-bold">Cộng đồng Gia Lai</h1>
                                        <p className="text-blue-100 text-sm">Chơi gì? Ăn Gì? ở Đâu? Với Ai?</p>
                                    </div>
                                </div>

                                <div className="flex items-center space-x-4">
                                    {isAuthenticated ? (
                                        <div className="flex items-center space-x-4 text-white">
                                            <span className="hidden md:block">Xin chào, {user.full_name}</span>
                                            <i className="fas fa-user-circle text-2xl"></i>
                                        </div>
                                    ) : (
                                        <div className="flex space-x-4">
                                            <button
                                                onClick={() => openAuthModal('login')}
                                                className="text-white hover:text-blue-100 font-semibold transition-colors"
                                            >
                                                <i className="fas fa-sign-in-alt mr-1"></i>
                                                Đăng nhập
                                            </button>
                                            <button
                                                onClick={() => openAuthModal('register')}
                                                className="bg-white text-blue-600 px-4 py-2 rounded-lg font-semibold hover:bg-blue-50 transition-colors"
                                            >
                                                <i className="fas fa-user-plus mr-1"></i>
                                                Đăng ký
                                            </button>
                                        </div>
                                    )}

                                    <a
                                        href="index.html"
                                        className="text-white hover:text-blue-100 font-semibold transition-colors"
                                    >
                                        <i className="fas fa-home mr-1"></i>
                                        Trang chủ
                                    </a>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="container mx-auto px-6 py-8">
                        {isAuthenticated ? (
                            <div className="max-w-2xl mx-auto">
                                <div className="text-center mb-8">
                                    <h2 className="text-3xl font-bold text-gray-900 mb-4">
                                        Chào mừng về với Cộng đồng!
                                    </h2>
                                    <p className="text-gray-600">
                                        Bạn đã đăng nhập thành công. Khám phá các nhà hàng tuyệt vời với AI.
                                    </p>
                                </div>
                                <UserProfile />
                            </div>
                        ) : (
                            <div className="text-center py-12">
                                <i className="fas fa-utensils text-6xl text-gray-300 mb-6"></i>
                                <h2 className="text-3xl font-bold text-gray-900 mb-4">
                                    Chào mừng đến Cộng đồng Gia Lai
                                </h2>
                                <p className="text-gray-600 text-lg mb-8">
                                    Khám phá ẩm thực địa phương với sức mạnh của AI
                                </p>
                                <div className="space-x-4">
                                    <button
                                        onClick={() => openAuthModal('register')}
                                        className="bg-blue-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors"
                                    >
                                        <i className="fas fa-user-plus mr-2"></i>
                                        Bắt đầu ngay
                                    </button>
                                    <button
                                        onClick={() => openAuthModal('login')}
                                        className="border border-blue-600 text-blue-600 px-8 py-3 rounded-lg font-semibold hover:bg-blue-50 transition-colors"
                                    >
                                        <i className="fas fa-sign-in-alt mr-2"></i>
                                        Đã có tài khoản
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Auth Modal */}
                    <AuthModal
                        isOpen={showAuthModal}
                        onClose={() => setShowAuthModal(false)}
                        initialMode={authMode}
                    />

                    {/* Footer */}
                    <footer className="bg-gray-800 text-white py-8 mt-16">
                        <div className="container mx-auto px-6 text-center">
                            <p>&copy; 2025 Cộng đồng Gia Lai. Powered by AI & FastAPI</p>
                        </div>
                    </footer>
                </div>
            );
        };

        // Root App Component
        const App = () => {
            return (
                <AuthProvider>
                    <AuthenticatedApp />
                </AuthProvider>
            );
        };

        // Render the app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
